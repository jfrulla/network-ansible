---
leaf_spine_interface:
  name: leaf_spine
  extras:
    - "alias leaf to spine"

leaf_uplink_bond_interface:
  name: leaf_uplink_bond
  extras:
    - "alias leaf uplink bond"
    - "bond-slaves swp51 swp52"
    - "mtu 9216"

spine_spine_interface:
  name: spine_spine
  extras:
    - "alias spine to spine"

server_ports:
  name: server_ports
  extras:
    - "mtu 9216"

switch_mgt_ports:
  name: switch_mgt_ports
  extras:
    - "mtu 9216"
    - "bridge-pvid 3900"

node_ports:
  name: node_ports
  extras:
    - "mtu 9216"
    - "bridge-pvid 200"

ceph_oob_ports:
  name: ceph_oob_ports
  extras:
    - "mtu 9216"
    - "bridge-pvid 3902"

server_ports_mlag:
  name: server_ports_mlag
  extras: []

ceph_oob_ports_mlag:
  name: ceph_oob_ports_mlag
  extras: []

ceph_leaf_ports_mlag:
  name: ceph_leaf_ports_mlag
  extras:
    - link-autoneg off
    - link-speed 100000
    - link-fec off
    - link-duplex full

oldcore_leaf_ports_mlag:
  name: oldcore_leaf_ports_mlag
  extras:
    - link-autoneg off
    - link-speed 100000
    - link-fec off
    - link-duplex full

uplink_ports_mlag:
  name: uplink_ports_mlag
  extras:
    - link-speed 40000
